

<!DOCTYPE html>
<html>
<head>
    <title>SMS Spam Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }

        h3 {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }

        h2 {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <form action="/predict" method="POST">

            <h3>Enter the message</h3>

            <input type="text" name="input" placeholder="Type your message here...">

            <br>

            <input type="submit" value="Predict">

            <h2>{{prediction_text}}</h2>

        </form>
    </div>

</body>
</html>
